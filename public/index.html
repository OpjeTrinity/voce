<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOCE CLUSTER</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: #05080c;
      color: #c9d1d9;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
    }
    .logo { font-size: 28px; font-weight: 700; color: #3fb950; letter-spacing: 0.2em; }
    .sub  { font-size: 12px; color: #6e7681; text-align: center; line-height: 1.8; max-width: 380px; }
    .links { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
    a.btn {
      display: block;
      padding: 14px 24px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.08em;
      transition: opacity 150ms;
    }
    a.btn:hover { opacity: 0.85; }
    .btn-host  { background: #3fb950; color: #05080c; }
    .note { font-size: 10px; color: #484f58; text-align: center; }
  </style>
</head>
<body>
  <div class="logo">⚡ VOCE CLUSTER</div>
  <div class="sub">
    Voice-Overclocked Compilation Engine<br/>
    Bio-Kinetic Dissipation™ Technology<br/>
    <span style="color:#f85149;">NOT REAL SCIENCE.</span>
  </div>
  <div class="links">
    <a href="/host" class="btn btn-host">▶ OPEN HOST DASHBOARD</a>
  </div>
  <div class="note">
    Audience members: scan the QR code shown on the host screen
  </div>
</body>
</html>
